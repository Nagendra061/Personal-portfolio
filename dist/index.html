    <!-- Inline script to prevent theme flash (FOUC) -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem("portfolio_theme_mode");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.setAttribute("data-theme", "light");
          }
          const savedColor = localStorage.getItem("portfolio_skin_color") || "crimson";
          document.documentElement.setAttribute("data-skin", savedColor);
        } catch (e) {}
      })();
    </script>
